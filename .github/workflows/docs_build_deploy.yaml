name: Docs - build and deploy

# The reference site takes its signatures from a running interpreter and the C API
# from the headers, so a source change is a doc change.
on:
  push:
    branches:
    - master
    paths:
    - "doc/**"
    - "include/**"
    - "squirrel/**"
    - "sqstdlib/**"
    - "sqmodules/**"
    - "sq/**"
    - "CMakeLists.txt"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.artifact_name }}
    permissions:
      contents: read

    steps:
    - name: Checkout project
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # build.py builds sq with cmake, refreshes the API dump from it and writes
    # doc/_site; check.py then verifies the dump and the pages as a set.
    - name: Build the reference site
      working-directory: ./doc
      run: |
        python3 build.py
        python3 gen/check.py

    - name: Generate artifact name
      id: artifact_name
      run: |
        export AN=docs_html_$(date +'%Y%m%dT%H%M%S')
        echo Generated artifact name: ${AN}
        echo "ARTIFACT_NAME=${AN}" >> $GITHUB_ENV
        echo "artifact_name=${AN}" >> $GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ./doc/_site
        retention-days: 1
        if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
    permissions:
      actions: read

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ./doc

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DOC_KEYID }}
        aws-secret-access-key: ${{ secrets.DOC_SECRET }}
        aws-region: eu-west-1

    - name: Update target
      run: |
        aws s3 sync ./doc s3://quirrel.io/doc --delete
        aws cloudfront create-invalidation --distribution-id ${{ secrets.DOC_DISTID }} --paths "/*"
